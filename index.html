<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4X IRAQ | المتجر الذكي للألعاب</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --main: #2ecc71; --bg: #0f1014; --card: #1a1c23; --text: #e2e8f0; --danger: #e74c3c; --blue: #3498db; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; min-height: 100vh; }
        
        /* شاشة الترحيب */
        .welcome-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: #090a0f; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white; transition: all 0.5s ease; }
        .welcome-screen h1 { color: var(--main); font-size: 35pt; margin-bottom: 10px; text-shadow: 0 0 15px rgba(46, 204, 113, 0.4); }
        .welcome-screen p { color: #a1a1a1; font-size: 14pt; margin-bottom: 25px; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 2px solid var(--main); margin-bottom: 30px; }
        header h1 { color: var(--main); margin: 0; font-size: 20pt; }
        .btn { background: var(--main); color: #000; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .admin-section { background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #334155; display: none; }
        .form-group { margin-bottom: 15px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #334155; color: white; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
        
        /* كارت اللعبة المطور */
        .card { background-color: var(--card); border-radius: 10px; border: 1px solid #232731; overflow: hidden; position: relative; display: flex; flex-direction: column; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 170px; object-fit: cover; background: #111; }
        .card-body { padding: 15px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
        .card-body h3 { margin: 10px 0 5px 0; font-size: 14pt; color: white; }
        .card-body .size-info { color: #94a3b8; font-size: 10pt; margin-bottom: 15px; }
        
        /* شارات نوع اللعبة */
        .badge { position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 4px; font-size: 9pt; font-weight: bold; color: black; }
        .badge.free { background: var(--main); }
        .badge.paid { background: #f1c40f; }

        .download-btn { display: inline-block; width: 100%; padding: 10px 0; background: transparent; border: 2px solid var(--main); color: var(--main); text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: auto; cursor: pointer; text-align: center; }
        .download-btn:hover { background: var(--main); color: black; }
        
        .buy-btn { display: inline-block; width: 100%; padding: 10px 0; background: #f1c40f; border: 2px solid #f1c40f; color: black; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: auto; cursor: pointer; text-align: center; }
        .buy-btn:hover { background: transparent; color: #f1c40f; }

        /* أزرار التحكم للأدمن */
        .admin-actions { display: none; margin-top: 10px; gap: 8px; }
        .edit-btn { flex: 1; padding: 8px 0; background: var(--blue); color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .delete-btn { flex: 1; padding: 8px 0; background: var(--danger); color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        
        .support-widget { position: fixed; bottom: 20px; left: 20px; z-index: 1000; }
        .support-btn { background: var(--main); color: black; border: none; padding: 12px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; }
        .support-box { display: none; width: 290px; background: var(--card); border: 1px solid var(--main); border-radius: 10px; padding: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- واجهة الترحيب الفخمة للزائر الجديد -->
    <div class="welcome-screen" id="welcomeScreen" style="display: none;">
        <h1>🎮 4X IRAQ</h1>
        <p>أهلاً بك في المتجر الذكي للألعاب والخدمات</p>
        <button class="btn" style="padding: 12px 30px; font-size: 12pt;" onclick="closeWelcomeScreen()">دخول المتجر 🚀</button>
    </div>

    <header>
        <h1>🎮 4X IRAQ</h1>
        <button class="btn" onclick="checkAdminPassword()">لوحة التحكم</button>
    </header>

    <section id="adminPanel" class="admin-section">
        <h2 id="panelTitle" style="color: var(--main); margin-top:0;">إضافة لعبة جديدة</h2>
        <input type="hidden" id="editGameId"> <!-- حقل مخفي لحفظ ID اللعبة عند التعديل -->
        
        <div class="form-group"><input type="text" id="gameTitle" placeholder="اسم اللعبة (مثال: Minecraft)"></div>
        <div class="form-group"><input type="text" id="gameSize" placeholder="الحجم (مثال: 1.5 GB)"></div>
        <div class="form-group"><input type="text" id="gameImage" placeholder="رابط صورة اللعبة (ضع رابط الصورة هنا)"></div>
        <div class="form-group"><input type="text" id="gameLink" placeholder="رابط التحميل أو الشراء (أي رابط تريد)"></div>
        <div class="form-group">
            <select id="gameType">
                <option value="free">مجانية (Free) - يظهر زر تحميل</option>
                <option value="paid">مدفوعة (Paid) - يظهر زر شراء</option>
            </select>
        </div>
        <button class="btn" id="submitGameBtn" onclick="addGame()">إضافة للموقع فوراً 🚀</button>
        <button class="btn" id="cancelEditBtn" style="background: #7f8c8d; display: none; margin-right: 10px;" onclick="resetForm()">إلغاء التعديل</button>
    </section>

    <h2 style="text-align: center; margin-bottom: 25px;">الألعاب المتوفرة للتحميل والشراء</h2>
    <div class="grid" id="gamesGrid"><p style="text-align: center;">جاري جلب الألعاب المضافة...</p></div>

    <!-- صندوق الدعم المادي والاقتراحات -->
    <div class="support-widget">
        <div class="support-box" id="supportBox">
            <h4 style="margin:0 0 10px 0; color:var(--main); text-align:center;">💡 طرق الدعم المادي للمتجر</h4>
            <p style="font-size: 10pt; color: #e2e8f0; line-height: 1.6; margin: 0 0 10px 0;">
                💳 <b>سوبر كي:</b> 1368224570 <br>
                💰 <b>زين كاش:</b> اكتب_رقمك_هنا <br>
                📱 <b>آسيا سيل:</b> اكتب_رقمك_هنا <br>
                📌 <i>أو أرسل كود كارت الشحن بالأسفل:</i>
            </p>
            <div class="form-group"><input type="text" id="supportText" placeholder="اكتب اقتراحك أو كود الرصيد هنا..."></div>
            <button class="btn" style="width: 100%;" onclick="sendSuggestion()">إرسال فوراً</button>
        </div>
        <button class="support-btn" id="supportBtnMain" onclick="toggleSupportBox()">💬 الدعم والاقتراحات</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlR7HCZj3nDngFkDEdeoIXHGsAK6hCPFY",
            authDomain: "x-iraq.firebaseapp.com",
            databaseURL: "https://x-iraq-default-rtdb.firebaseio.com",
            projectId: "x-iraq",
            storageBucket: "x-iraq.firebaseimagesstorage.app",
            messagingSenderId: "711532790010",
            appId: "1:711532790010:web:0989b70be91259efaac943"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let isAdminLoggedIn = false;
        let allGamesData = {}; // لحفظ بيانات الألعاب محلياً لسهولة التعديل

        // فحص ظهور شاشة الترحيب
        function checkWelcomeScreen() {
            if (!localStorage.getItem('welcomed_4x')) {
                document.getElementById('welcomeScreen').style.display = 'flex';
            }
        }
        function closeWelcomeScreen() {
            document.getElementById('welcomeScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcomeScreen').style.display = 'none';
                localStorage.setItem('welcomed_4x', 'true');
            }, 500);
        }

        function checkAdminPassword() {
            if (isAdminLoggedIn) { 
                document.getElementById('adminPanel').style.display = (document.getElementById('adminPanel').style.display === 'block') ? 'none' : 'block'; 
                return; 
            }
            const password = prompt("أدخل رمز الأمان الخاص بك:");
            if (password === "4x2026") { 
                isAdminLoggedIn = true; 
                document.getElementById('adminPanel').style.display = "block";
                updateAdminButtonsVisibility();
            }
            else if (password !== null) alert("الرمز السري خاطئ!");
        }

        function updateAdminButtonsVisibility() {
            document.querySelectorAll('.admin-actions').forEach(panel => panel.style.display = isAdminLoggedIn ? 'flex' : 'none');
        }

        function fetchGames() {
            database.ref('games').on('value', (snapshot) => {
                const grid = document.getElementById('gamesGrid');
                const data = snapshot.val();
                grid.innerHTML = '';
                if(data) {
                    allGamesData = data; // حفظ النسخة الحالية
                    Object.keys(data).reverse().forEach(key => {
                        const game = data[key];
                        const showAdminStyle = isAdminLoggedIn ? 'style="display:flex;"' : '';
                        
                        // تحديد الشارة ونوع الزر (تحميل أو شراء)
                        let typeBadge = '';
                        let actionBtn = '';
                        
                        if (game.type === 'paid') {
                            typeBadge = '<span class="badge paid">مدفوعة</span>';
                            actionBtn = `<button class="buy-btn" onclick="openPurchaseFlow()">شراء اللعبة 🛒</button>`;
                        } else {
                            typeBadge = '<span class="badge free">مجانية</span>';
                            actionBtn = `<a href="${game.link}" class="download-btn" target="_blank">تحميل اللعبة 📥</a>`;
                        }

                        const defaultImg = "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=500";
                        const gameImg = game.image && game.image.trim() !== "" ? game.image : defaultImg;

                        grid.innerHTML += `
                            <div class="card" id="card-${key}">
                                ${typeBadge}
                                <img src="${gameImg}" alt="${game.title}">
                                <div class="card-body">
                                    <h3>${game.title}</h3>
                                    <div class="size-info">الحجم: ${game.size || 'غير محدد'}</div>
                                    ${actionBtn}
                                    <div class="admin-actions" ${showAdminStyle}>
                                        <button class="edit-btn" onclick="startEditGame('${key}')">تعديل ✏️</button>
                                        <button class="delete-btn" onclick="deleteGame('${key}')">حذف ❌</button>
                                    </div>
                                </div>
                            </div>`;
                    });
                } else {
                    grid.innerHTML = '<p style="text-align:center; color:#a1a1a1;">لا توجد ألعاب مضافة حالياً.</p>';
                }
            });
        }

        function openPurchaseFlow() {
            // فتح صندوق طرق الدفع فوراً عند الضغط على شراء
            const box = document.getElementById('supportBox');
            box.style.display = 'block';
            document.getElementById('supportBtnMain').scrollIntoView({ behavior: 'smooth' });
            alert("لشراء اللعبة، يرجى تحويل المبلغ عبر إحدى الطرق التالية وإرسال كود التأكيد بالصندوق الأسفل! 👇");
        }

        function addGame() {
            if (!isAdminLoggedIn) return;
            const title = document.getElementById('gameTitle').value;
            const size = document.getElementById('gameSize').value;
            const image = document.getElementById('gameImage').value;
            const link = document.getElementById('gameLink').value;
            const type = document.getElementById('gameType').value;

            if(!title || !link) return alert("يرجى كتابة اسم اللعبة ورابط التحميل على الأقل!");

            database.ref('games').push().set({ title, size, image, link, type }).then(() => {
                alert("تم رفع اللعبة للمتجر بنجاح! 🎉");
                resetForm();
            });
        }

        // دالة بدء تعديل اللعبة ونقل بياناتها للفروم فوك
        function startEditGame(gameId) {
            const game = allGamesData[gameId];
            if (!game) return;

            document.getElementById('panelTitle').innerText = "تعديل بيانات المنتج ✏️";
            document.getElementById('editGameId').value = gameId;
            document.getElementById('gameTitle').value = game.title || '';
            document.getElementById('gameSize').value = game.size || '';
            document.getElementById('gameImage').value = game.image || '';
            document.getElementById('gameLink').value = game.link || '';
            document.getElementById('gameType').value = game.type || 'free';

            // تحويل زر الإضافة إلى زر حفظ التعديلات
            const submitBtn = document.getElementById('submitGameBtn');
            submitBtn.innerText = "حفظ التعديلات المحدثة 💾";
            submitBtn.onclick = function() { saveEditedGame(); };
            
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('adminPanel').scrollIntoView({ behavior: 'smooth' });
        }

        // دالة حفظ التعديلات وإرسالها للفايربيس
        function saveEditedGame() {
            const gameId = document.getElementById('editGameId').value;
            const title = document.getElementById('gameTitle').value;
            const size = document.getElementById('gameSize').value;
            const image = document.getElementById('gameImage').value;
            const link = document.getElementById('gameLink').value;
            const type = document.getElementById('gameType').value;

            if(!title || !link) return alert("الاسم والرابط مطلوبين!");

            database.ref('games/' + gameId).update({ title, size, image, link, type })
                .then(() => {
                    alert("تم تحديث بيانات اللعبة بنجاح! ✏️🎉");
                    resetForm();
                })
                .catch(err => alert("فشل التحديث: " + err.message));
        }

        // إعادة تصفير الفورم للوضع الطبيعي
        function resetForm() {
            document.getElementById('panelTitle').innerText = "إضافة لعبة جديدة";
            document.getElementById('editGameId').value = '';
            document.getElementById('gameTitle').value = '';
            document.getElementById('gameSize').value = '';
            document.getElementById('gameImage').value = '';
            document.getElementById('gameLink').value = '';
            document.getElementById('gameType').value = 'free';

            const submitBtn = document.getElementById('submitGameBtn');
            submitBtn.innerText = "إضافة للموقع فوراً 🚀";
            submitBtn.onclick = function() { addGame(); };

            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        function deleteGame(gameId) {
            if (!isAdminLoggedIn) return;
            if (confirm("هل تريد حذف هذه اللعبة بشكل نهائي؟")) {
                database.ref('games/' + gameId).remove()
                    .then(() => alert("تم الحذف بنجاح!"))
                    .catch((error) => alert("فشل الحذف: " + error.message));
            }
        }

        function toggleSupportBox() { const box = document.getElementById('supportBox'); box.style.display = (box.style.display === 'block') ? 'none' : 'block'; }
        function sendSuggestion() {
            const text = document.getElementById('supportText').value;
            if(text) { database.ref('suggestions').push().set({ message: text, timestamp: new Date().toISOString() }); alert("تم الإرسال بنجاح! شكراً لك."); document.getElementById('supportText').value = ''; }
        }
        
        window.onload = function() {
            checkWelcomeScreen();
            fetchGames();
        };
    </script>
</body>
</html>
