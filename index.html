<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4X IRAQ | المتجر الذكي للألعاب</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --main: #2ecc71;
            --bg: #0f1014;
            --card: #1a1c23;
            --text: #e2e8f0;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            position: relative;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 2px solid var(--main);
            margin-bottom: 30px;
        }
        header h1 { color: var(--main); margin: 0; font-size: 20pt; }
        .btn {
            background: var(--main);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .admin-section {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #334155;
            display: none;
        }
        .form-group { margin-bottom: 15px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; background: #0b0f19;
            border: 1px solid #334155; color: white; border-radius: 5px; box-sizing: border-box;
            font-family: inherit;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 80px; /* مساحة عشان صندوق الاقتراحات ما يغطي الكروت */
        }
        .card {
            background-color: var(--card);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            border: 1px solid #232731;
        }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-body { padding: 15px; text-align: center; }
        .card-body h3 { margin: 10px 0; font-size: 14pt; }
        .card-body p { color: #94a3b8; font-size: 11pt; margin-bottom: 15px; }
        .download-btn {
            display: inline-block; width: 100%; padding: 10px 0;
            background: transparent; border: 2px solid var(--main);
            color: var(--main); text-decoration: none; border-radius: 5px; font-weight: bold;
        }
        .download-btn:hover { background: var(--main); color: black; }

        /* ستايل صندوق الاقتراحات والدعم بالزاوية */
        .support-widget {
            position: fixed;
            bottom: 20px;
            left: 20px; /* بالزاوية أسفل اليسار */
            z-index: 1000;
        }
        .support-btn {
            background: var(--main);
            color: black;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
            font-size: 11pt;
        }
        .support-box {
            display: none;
            width: 300px;
            background: var(--card);
            border: 1px solid var(--main);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .support-box h4 { margin: 0 0 10px 0; color: var(--main); }
    </style>
</head>
<body>

    <header>
        <h1>🎮 4X IRAQ</h1>
        <button class="btn" id="loginBtn" onclick="showLoginModal()">دخول المشرف</button>
    </header>

    <section id="adminPanel" class="admin-section">
        <h2 id="panelTitle" style="color: var(--main); margin-top:0;">تسجيل دخول الأدمن</h2>
        <div id="loginForm">
            <div class="form-group"><input type="text" id="username" placeholder="اسم المستخدم"></div>
            <div class="form-group"><input type="password" id="password" placeholder="كلمة المرور"></div>
            <button class="btn" onclick="login()">دخول</button>
        </div>
        <div id="addGameForm" style="display: none;">
            <div class="form-group"><input type="text" id="gameTitle" placeholder="اسم اللعبة"></div>
            <div class="form-group"><input type="text" id="gameSize" placeholder="الحجم (مثال: 45 GB)"></div>
            <div class="form-group"><input type="text" id="gameImage" placeholder="رابط صورة اللعبة"></div>
            <div class="form-group"><input type="text" id="gameLink" placeholder="رابط التحميل"></div>
            <button class="btn" onclick="addGame()">إضافة اللعبة فوراً</button>
        </div>
    </section>

    <h2 style="text-align: center; margin-bottom: 25px;">الألعاب المتوفرة للتحميل</h2>
    <div class="grid" id="gamesGrid">
        <p id="statusText">جاري تحميل الألعاب من قاعدة البيانات...</p>
    </div>

    <div class="support-widget">
        <div class="support-box" id="supportBox">
            <h4>💡 صندوق الدعم والاقتراحات</h4>
            <div class="form-group">
                <input type="text" id="supportName" placeholder="اسمك (اختياري)">
            </div>
            <div class="form-group">
                <textarea id="supportText" rows="3" placeholder="اكتب اقتراحك، مشكلتك أو كلمتك هنا..." required></textarea>
            </div>
            <button class="btn" style="width: 100%;" onclick="sendSuggestion()">إرسال</button>
        </div>
        <button class="support-btn" onclick="toggleSupportBox()">💬 تواصل معنا / اقتراح</button>
    </div>

    <script>
        // ضع إعدادات الفايربيس الخاصة بمشروعك هنا
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // جلب الألعاب
        function fetchGames() {
            const grid = document.getElementById('gamesGrid');
            database.ref('games').on('value', (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    grid.innerHTML = '';
                    Object.keys(data).reverse().forEach(key => {
                        const game = data[key];
                        grid.innerHTML += `
                            <div class="card">
                                <img src="${game.image || 'https://via.placeholder.com/300x180'}" alt="${game.title}">
                                <div class="card-body">
                                    <h3>${game.title}</h3>
                                    <p>الحجم: ${game.size}</p>
                                    <a href="${game.link}" class="download-btn" target="_blank">تحميل</a>
                                </div>
                            </div>`;
                    });
                } else {
                    grid.innerHTML = '<p>لا توجد ألعاب مضافة حالياً.</p>';
                }
            }, (error) => {
                grid.innerHTML = '<p style="color:red;">خطأ في جلب البيانات: ' + error.message + '</p>';
            });
        }

        function showLoginModal() {
            document.getElementById('adminPanel').style.display = 'block';
        }

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (user === "admin" && pass === "4x1234") {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('addGameForm').style.display = 'block';
                document.getElementById('panelTitle').innerText = "لوحة إضافة الألعاب";
                document.getElementById('loginBtn').style.display = 'none';
            } else {
                alert("اسم المستخدم أو كلمة المرور خطأ!");
            }
        }

        function addGame() {
            const title = document.getElementById('gameTitle').value;
            const size = document.getElementById('gameSize').value;
            const image = document.getElementById('gameImage').value;
            const link = document.getElementById('gameLink').value;

            if(!title || !link) return alert("يرجى ملء الاسم والرابط!");

            database.ref('games').push().set({
                title, size, link,
                image: image || "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=500"
            }).then(() => {
                alert("تمت الإضافة بنجاح!");
                document.getElementById('gameTitle').value = '';
                document.getElementById('gameSize').value = '';
                document.getElementById('gameImage').value = '';
                document.getElementById('gameLink').value = '';
            });
        }

        // إخفاء وإظهار صندوق الاقتراحات
        function toggleSupportBox() {
            const box = document.getElementById('supportBox');
            box.style.display = (box.style.display === 'block') ? 'none' : 'block';
        }

        // إرسال الاقتراحات أو المشاكل للفايربيس
        function sendSuggestion() {
            const name = document.getElementById('supportName').value || "زائر مجهول";
            const text = document.getElementById('supportText').value;

            if(!text) return alert("يرجى كتابة رسالتك أولاً!");

            database.ref('suggestions').push().set({
                username: name,
                message: text,
                timestamp: new Date().toISOString()
            }).then(() => {
                alert("شكراً لك! تم إرسال اقتراحك/مشكلتك بنجاح.");
                document.getElementById('supportText').value = '';
                toggleSupportBox(); // إغلاق الصندوق بعد الإرسال
            }).catch(err => {
                alert("فشل الإرسال: " + err.message);
            });
        }

        window.onload = fetchGames;
    </script>
</body>
</html>
