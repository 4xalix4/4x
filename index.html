<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>4X IRAQ | المتجر الشامل</title>
    <style>
        :root {
            --dark: #131921;
            --yellow: #febd69;
            --bg: #eaeded;
            --white: #fff;
            --wa: #25d366;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: right;
        }
        body {
            background-color: var(--bg);
            color: #0F1111;
            min-height: 100vh;
        }
        header {
            background: var(--dark);
            color: var(--white);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 18pt;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .logo span { color: var(--yellow); }
        .search-bar {
            flex-grow: 1;
            max-width: 500px;
            display: flex;
            background: var(--white);
            border-radius: 4px;
            overflow: hidden;
        }
        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border: none;
            outline: none;
        }
        .search-btn {
            background: var(--yellow);
            border: none;
            padding: 0 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .sub-header {
            background: #232f3e;
            color: var(--white);
            padding: 8px 20px;
            display: flex;
            gap: 20px;
            font-size: 9.5pt;
            overflow-x: auto;
        }
        .sub-header span {
            cursor: pointer;
            white-space: nowrap;
        }
        .sub-header span:hover { color: var(--yellow); }
        .container {
            max-width: 1300px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .section-title {
            font-size: 14pt;
            margin-bottom: 15px;
            font-weight: bold;
            border-right: 4px solid var(--yellow);
            padding-right: 10px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }
        .product-card {
            background: var(--white);
            border: 1px solid #d5d9d9;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }
        .product-img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            margin-bottom: 10px;
            background: #f7f7f7;
            border-radius: 4px;
        }
        .product-title {
            font-size: 10pt;
            font-weight: bold;
            margin-bottom: 6px;
            height: 36px;
            overflow: hidden;
        }
        .product-price {
            font-size: 11pt;
            font-weight: bold;
            color: #B12704;
            margin-bottom: 10px;
            direction: ltr;
            text-align: right;
        }
        .buy-btn {
            background: var(--yellow);
            border: none;
            padding: 8px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-box {
            background: var(--white);
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 16pt;
            cursor: pointer;
            color: #565959;
        }
        .pkg-item {
            border: 1px solid #d5d9d9;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            background: #fafafa;
            margin-bottom: 8px;
        }
        .pkg-item.selected {
            border-color: #B12704;
            background: #fff8f5;
        }
        .qty-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f7f7f7;
            border: 1px solid #d5d9d9;
            border-radius: 6px;
            padding: 6px 12px;
            margin: 10px 0;
        }
        .qty-btn {
            background: var(--yellow);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }
        .pay-box {
            background: #f0f8ff;
            border: 1px solid #b8daff;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 9pt;
            color: #004085;
            text-align: center;
        }
        .wa-btn {
            background: var(--wa);
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 20px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        .form-group { margin-bottom: 10px; }
        .form-group label {
            display: block;
            font-size: 8.5pt;
            color: #565959;
            margin-bottom: 3px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #d5d9d9;
            border-radius: 4px;
            outline: none;
        }
        .admin-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 9pt;
        }
        .del-btn {
            background: #cc0000;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="checkAdminPassword()">4X <span>IRAQ</span> 🛒</div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج..." onkeyup="searchProducts()">
            <button class="search-btn">🔍</button>
        </div>
    </header>

    <div class="sub-header">
        <span onclick="filterCategory('all')">🔥 الكل</span>
        <span onclick="filterCategory('games')">🎮 شحن الألعاب</span>
        <span onclick="filterCategory('hardware')">💻 قطع الحاسبات</span>
    </div>

    <div class="container">
        <div class="section-title" id="sectionTitle">جميع المنتجات والخدمات</div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- نافذة الشراء -->
    <div class="modal" id="buyModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" style="margin-bottom:12px;">شراء المنتج</h3>
            <div id="modalPackagesList"></div>

            <div class="qty-box">
                <span style="font-size: 9pt; font-weight: bold;">الكمية:</span>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="qty-btn" onclick="changeQuantity(-1)">-</button>
                    <span id="qtyDisplay" style="font-weight:bold;">1</span>
                    <button class="qty-btn" onclick="changeQuantity(1)">+</button>
                </div>
            </div>

            <div class="pay-box">💳 الدفع كاش أو بالماستر كارد عند الاستلام.</div>
            <a id="waOrderBtn" href="#" target="_blank" class="wa-btn">إتمام الطلب عبر واتساب 💬</a>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="modal" id="adminModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeAdminModal()">&times;</span>
            <h3 style="margin-bottom:10px;">⚙️ لوحة التحكم</h3>
            
            <div class="form-group">
                <label>رقم أو يوزر الواتساب:</label>
                <input type="text" id="adminWaNumber" placeholder="حط الرقم أو اليوزر">
            </div>
            <div class="form-group">
                <label>الرسالة التلقائية:</label>
                <input type="text" id="adminCustomMsg" placeholder="مقدمة الرسالة">
            </div>
            <button class="buy-btn" style="background:var(--wa); color:#fff; margin-bottom:15px;" onclick="saveSocialLinks()">حفظ الإعدادات 💾</button>

            <hr style="margin:10px 0; border:0; border-top:1px solid #ddd;">
            <h4 style="font-size:9.5pt; margin-bottom:8px;">➕ إضافة منتج جديد:</h4>
            
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="newTitle">
            </div>
            <div class="form-group">
                <label>القسم:</label>
                <select id="newCategory">
                    <option value="games">شحن ألعاب</option>
                    <option value="hardware">قطع حاسبات</option>
                </select>
            </div>
            <div class="form-group">
                <label>رابط الصورة:</label>
                <input type="text" id="newImage">
            </div>
            <div class="form-group">
                <label>الفئة / النوع:</label>
                <input type="text" id="newPkgName" placeholder="مثال: قطعة واحدة">
            </div>
            <div class="form-group">
                <label>السعر:</label>
                <input type="text" id="newPkgPrice" placeholder="مثال: 15000">
            </div>
            <button class="buy-btn" style="background:var(--dark); color:#fff; margin-bottom:15px;" onclick="addNewProduct()">إضافة المنتج</button>

            <h4 style="font-size:9.5pt; margin-bottom:8px;">🗑️ إدارة المنتجات:</h4>
            <div id="adminProductsList" style="max-height:150px; overflow-y:auto;"></div>

            <button class="del-btn" style="width:100%; padding:8px; margin-top:10px;" onclick="resetStoreCache()">🔄 إعادة ضبط وتصفير البيانات</button>
        </div>
    </div>

    <script>
        var ADMIN_PASSWORD = "xx4xx";
        var currentQty = 1;

        var defaultProducts = [
            {
                id: "pubg",
                category: "games",
                title: "شدات ببجي موبايل (PUBG Mobile UC)",
                image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=500",
                packages: [{ name: "60 UC", price: "1,500 IQD" }]
            },
            {
                id: "gpu_rx580",
                category: "hardware",
                title: "كرت شاشة AMD Radeon RX 580 8GB",
                image: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?q=80&w=500",
                packages: [{ name: "نسخة ممتازة", price: "85,000 IQD" }]
            }
        ];

        var socialLinks = {
            whatsapp: "4xalix4",
            customMsg: "مرحباً متجر 4X IRAQ، أريد شراء المنتج التالي:"
        };
        var storeData = defaultProducts;

        try {
            var savedLinks = localStorage.getItem('4x_social_links');
            if (savedLinks) {
                socialLinks = JSON.parse(savedLinks);
            }
            
            var savedData = localStorage.getItem('4x_store_data');
            if (savedData !== null) {
                storeData = JSON.parse(savedData);
            } else {
                localStorage.setItem('4x_store_data', JSON.stringify(defaultProducts));
            }
        } catch (e) {
            storeData = defaultProducts;
        }

        var selectedItem = null;
        var selectedPkg = null;

        function formatPriceToIQD(rawPrice) {
            if (!rawPrice) return "";
            var clean = rawPrice.toString().replace(/[^0-9]/g, '');
            if (!clean) return rawPrice;
            return Number(clean).toLocaleString('en-US') + " IQD";
        }

        function renderProducts(items) {
            var grid = document.getElementById('productsGrid');
            if (!grid) return;
            grid.innerHTML = '';
            if (!items || items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#777; padding:20px;">لا توجد منتجات حالياً.</p>';
                return;
            }
            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var p = (item.packages && item.packages[0]) ? item.packages[0].price : '';
                var html = '<div class="product-card">';
                html += '<img src="' + item.image + '" class="product-img" onerror="this.src=\'https://via.placeholder.com/200?text=4X+IRAQ\'">';
                html += '<div class="product-title">' + item.title + '</div>';
                html += '<div class="product-price">' + p + '</div>';
                html += '<button class="buy-btn" onclick="openModal(\'' + item.id + '\')">شراء الآن 🛒</button>';
                html += '</div>';
                grid.innerHTML += html;
            }
        }

        function filterCategory(cat) {
            var t = 'جميع المنتجات والخدمات';
            if (cat === 'games') t = 'قسم شحن الألعاب';
            if (cat === 'hardware') t = 'قسم قطع الحاسبات';
            document.getElementById('sectionTitle').innerText = t;

            if (cat === 'all') {
                renderProducts(storeData);
            } else {
                var filtered = [];
                for (var i = 0; i < storeData.length; i++) {
                    if (storeData[i].category === cat) filtered.push(storeData[i]);
                }
                renderProducts(filtered);
            }
        }

        function openModal(itemId) {
            for (var i = 0; i < storeData.length; i++) {
                if (storeData[i].id === itemId) {
                    selectedItem = storeData[i];
                    break;
                }
            }
            if (!selectedItem) return;
            selectedPkg = null;
            currentQty = 1;
            document.getElementById('qtyDisplay').innerText = currentQty;
            document.getElementById('modalTitle').innerText = selectedItem.title;
            
            var pkgList = document.getElementById('modalPackagesList');
            pkgList.innerHTML = '';
            for (var j = 0; j < selectedItem.packages.length; j++) {
                var pkg = selectedItem.packages[j];
                var isSel = (j === 0) ? 'selected' : '';
                var itemHtml = '<div class="pkg-item ' + isSel + '" onclick="selectPkg(this, \'' + pkg.name + '\', \'' + pkg.price + '\')">';
                itemHtml += '<span><strong>' + pkg.name + '</strong></span>';
                itemHtml += '<span style="color:#B12704; font-weight:bold;">' + pkg.price + '</span>';
                itemHtml += '</div>';
                pkgList.innerHTML += itemHtml;
            }
            if (selectedItem.packages.length > 0) {
                selectPkg(pkgList.children[0], selectedItem.packages[0].name, selectedItem.packages[0].price);
            }
            document.getElementById('buyModal').style.display = 'flex';
        }

        function changeQuantity(c) {
            currentQty += c;
            if (currentQty < 1) currentQty = 1;
            document.getElementById('qtyDisplay').innerText = currentQty;
            if (selectedPkg) updateWaLink();
        }

        function selectPkg(el, name, price) {
            var items = document.querySelectorAll('.pkg-item');
            for (var i = 0; i < items.length; i++) items[i].classList.remove('selected');
            if (el) el.classList.add('selected');
            selectedPkg = { name: name, price: price };
            updateWaLink();
        }

        function updateWaLink() {
            var head = socialLinks.customMsg || "مرحباً، أريد طلب هذا المنتج:";
            var msg = head;
            msg += "\n\n🎮 المنتج: " + selectedItem.title;
            msg += "\n📦 الفئة: " + selectedPkg.name;
            msg += "\n🔢 الكمية: (" + currentQty + ")";
            msg += "\n💰 السعر: " + selectedPkg.price;
            msg += "\n💳 الدفع: ماستر كارد / كاش عند الاستلام";
            var cleanWa = (socialLinks.whatsapp || "4xalix4").replace('+', '').trim();
            document.getElementById('waOrderBtn').href = "https://wa.me/" + cleanWa + "?text=" + encodeURIComponent(msg);
        }

        function closeModal() {
            document.getElementById('buyModal').style.display = 'none';
        }

        function checkAdminPassword() {
            var pwd = prompt("كلمة المرور السرية:");
            if (pwd === ADMIN_PASSWORD) {
                renderAdminList();
                document.getElementById('adminModal').style.display = 'flex';
            } else if (pwd !== null) {
                alert("كلمة المرور خاطئة!");
            }
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function saveSocialLinks() {
            var wa = document.getElementById('adminWaNumber').value.trim();
            var msg = document.getElementById('adminCustomMsg').value.trim();
            if (!wa) {
                alert("يرجى كتابة يوزر الواتساب!");
                return;
            }
            socialLinks = {
                whatsapp: wa,
                customMsg: msg || "مرحباً، أريد طلب هذا المنتج:"
            };
            localStorage.setItem('4x_social_links', JSON.stringify(socialLinks));
            alert("تم الحفظ بنجاح! 💾");
        }

        function renderAdminList() {
            var list = document.getElementById('adminProductsList');
            list.innerHTML = '';
            for (var i = 0; i < storeData.length; i++) {
                var row = '<div class="admin-row">';
                row += '<span>' + storeData[i].title + '</span>';
                row += '<button class="del-btn" onclick="deleteProduct(\'' + storeData[i].id + '\')">حذف</button>';
                row += '</div>';
                list.innerHTML += row;
            }
        }

        function addNewProduct() {
            var t = document.getElementById('newTitle').value.trim();
            var c = document.getElementById('newCategory').value;
            var img = document.getElementById('newImage').value.trim() || 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=500';
            var pkg = document.getElementById('newPkgName').value.trim();
            var p = document.getElementById('newPkgPrice').value.trim();

            if (!t || !pkg || !p) {
                alert('ملء جميع الحقول مطلوب!');
                return;
            }

            storeData.push({
                id: 'item_' + Date.now(),
                category: c,
