<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4X IRAQ | المتجر الشامل للألعاب وقطع الحاسبات</title>
    <style>
        :root {
            --az-dark: #131921;
            --az-light-dark: #232f3e;
            --az-yellow: #febd69;
            --az-yellow-hover: #f3a847;
            --bg-color: #eaeded;
            --text-main: #0F1111;
            --text-light: #565959;
            --white: #ffffff;
            --whatsapp: #25d366;
            --telegram: #0088cc;
            --border-color: #d5d9d9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; text-align: right; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* شريط التنقل العلوي على طراز أمازون */
        header {
            background-color: var(--az-dark);
            color: var(--white);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            font-size: 20pt;
            font-weight: bold;
            color: var(--white);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .logo-area span { color: var(--az-yellow); }

        /* شريط البحث */
        .search-bar {
            flex-grow: 1;
            max-width: 600px;
            display: flex;
            background: var(--white);
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .search-bar:focus-within { border-color: var(--az-yellow); }
        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            border: none;
            outline: none;
            font-size: 10.5pt;
            text-align: right;
        }
        .search-btn {
            background: var(--az-yellow);
            border: none;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11pt;
        }
        .search-btn:hover { background: var(--az-yellow-hover); }

        /* أزرار التواصل السريع في الهيدر */
        .header-actions {
            display: flex;
            gap: 10px;
        }
        .contact-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            color: white;
            font-size: 9.5pt;
            font-weight: bold;
        }
        .wa-btn { background: var(--whatsapp); }
        .tg-btn { background: var(--telegram); }

        /* شريط التصنيفات الفرعي */
        .sub-header {
            background-color: var(--az-light-dark);
            color: var(--white);
            padding: 8px 20px;
            display: flex;
            gap: 20px;
            font-size: 10pt;
            overflow-x: auto;
        }
        .sub-header span { cursor: pointer; white-space: nowrap; }
        .sub-header span:hover { color: var(--az-yellow); }

        /* المحتوى الرئيسي و شبكة المنتجات */
        .container {
            max-width: 1300px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .section-title {
            font-size: 15pt;
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--az-dark);
            border-right: 4px solid var(--az-yellow);
            padding-right: 10px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        /* كارت المنتج على طراز أمازون */
        .product-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: box-shadow 0.2s;
        }
        .product-card:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .product-img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            margin-bottom: 12px;
            background: #f7f7f7;
            border-radius: 4px;
        }
        .product-title {
            font-size: 11pt;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 8px;
            height: 40px;
            overflow: hidden;
        }
        .product-price {
            font-size: 13pt;
            font-weight: bold;
            color: #B12704; /* لون السعر المشهور في أمازون */
            margin-bottom: 12px;
        }
        .buy-action-btn {
            background: var(--az-yellow);
            border: none;
            padding: 10px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            margin-top: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .buy-action-btn:hover { background: var(--az-yellow-hover); }

        /* نافذة الشراء المنبثقة (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 3000;
            display: none; justify-content: center; align-items: center;
        }
        .modal-box {
            background: var(--white);
            color: var(--text-main);
            border-radius: 8px;
            width: 90%; max-width: 450px; padding: 25px;
            position: relative;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .close-modal {
            position: absolute; top: 12px; left: 15px; font-size: 18pt; cursor: pointer; color: var(--text-light);
        }
        .modal-box h3 { margin-bottom: 15px; color: var(--az-dark); font-size: 14pt; }
        
        .modal-packages {
            display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; margin-bottom: 15px;
        }
        .modal-pkg-item {
            border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;
            display: flex; justify-content: space-between; cursor: pointer; background: #fafafa;
        }
        .modal-pkg-item.selected { border-color: #B12704; background: #fff8f5; }
        .modal-pkg-item .pkg-p { color: #B12704; font-weight: bold; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 9.5pt; color: var(--text-light); margin-bottom: 5px; }
        .form-group input {
            width: 100%; padding: 10px; border: 1px solid var(--border-color);
            border-radius: 4px; outline: none; font-size: 10pt;
        }
        .form-group input:focus { border-color: var(--az-yellow); box-shadow: 0 0 3px rgba(254,189,105,0.8); }

        /* أزرار الدفع والتواصل داخل النافذة */
        .modal-buttons {
            display: flex; flex-direction: column; gap: 10px; margin-top: 15px;
        }
        .btn-superkey {
            background: var(--az-yellow); border: none; padding: 12px; border-radius: 20px; font-weight: bold; cursor: pointer;
        }
        .btn-direct-wa {
            background: var(--whatsapp); color: white; border: none; padding: 10px; border-radius: 20px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center;
        }
        .btn-direct-tg {
            background: var(--telegram); color: white; border: none; padding: 10px; border-radius: 20px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center;
        }
    </style>
</head>
<body>

    <!-- الهيدر الرئيسي -->
    <header>
        <div class="logo-area">4X <span>IRAQ</span> 🛒</div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="ابحث عن لعبة، بطاقة، أو قطعة حاسوب..." onkeyup="searchProducts()">
            <button class="search-btn">🔍</button>
        </div>
        <div class="header-actions">
            <a href="https://wa.me/9647767814099" target="_blank" class="contact-pill wa-btn">💬 واتساب</a>
            <a href="https://t.me/x4x_Shopx" target="_blank" class="contact-pill tg-btn">✈️ تليجرام</a>
        </div>
    </header>

    <!-- شريط التصنيفات الفرعي -->
    <div class="sub-header">
        <span>🔥 الكل</span>
        <span>🎮 شحن الألعاب</span>
        <span>💻 قطع الحاسبات وهاردوير</span>
        <span>⚡ بطاقات رقمية</span>
    </div>

    <div class="container">
        <div class="section-title">العروض والخدمات المتوفرة</div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- نافذة الشراء والتفاصيل -->
    <div class="modal-overlay" id="buyModal">
        <div class="modal-box">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">شراء المنتج</h3>
            
            <div class="modal-packages" id="modalPackagesList"></div>

            <div class="form-group">
                <label id="inputLabel">معلومات الحساب أو الـ ID:</label>
                <input type="text" id="userIdentifier" placeholder="أدخل البيانات المطلوبة هنا...">
            </div>

            <div class="modal-buttons">
                <button class="btn-superkey" onclick="payWithSuperKey()">⚡ إتمام الدفع أوتوماتيكياً (SuperKey)</button>
                <a id="waOrderBtn" href="#" target="_blank" class="btn-direct-wa">طلب وإرسال الإيصال عبر واتساب 💬</a>
                <a id="tgOrderBtn" href="https://t.me/x4x_Shopx" target="_blank" class="btn-direct-tg">طلب وإرسال الإيصال عبر تليجرام ✈️</a>
            </div>
        </div>
    </div>

    <script>
        // قاعدة البيانات (ألعاب + قطع حاسبات وهاردوير)
        const storeData = [
            {
                id: "pubg",
                category: "games",
                title: "شدات ببجي موبايل (PUBG Mobile UC)",
                image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=500",
                idLabel: "رقم الـ Player ID:",
                idPlaceholder: "مثال: 5123456789",
                packages: [
                    { name: "60 UC", price: "1,500 د.ع" },
                    { name: "325 UC", price: "7,500 د.ع" },
                    { name: "660 UC", price: "15,000 د.ع" }
                ]
            },
            {
                id: "roblox",
                category: "games",
                title: "روبلوكس روبوكس (Roblox Robux)",
                image: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=500",
                idLabel: "اسم المستخدم (Username):",
                idPlaceholder: "أدخل يوزر حسابك",
                packages: [
                    { name: "400 Robux", price: "7,000 د.ع" },
                    { name: "800 Robux", price: "14,000 د.ع" }
                ]
            },
            {
                id: "gpu_rx580",
                category: "hardware",
                title: "كرت شاشة AMD Radeon RX 580 8GB",
                image: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?q=80&w=500",
                idLabel: "عنوان الاستلام أو ورقة الحجز:",
                idPlaceholder: "الاسم ورقم الهاتف والعنوان في البصرة/الزبير",
                packages: [
                    { name: "نسخة ممتازة نظيفة (ضمان تشغيل)", price: "85,000 د.ع" }
                ]
            },
            {
                id: "xeon_cpu",
                category: "hardware",
                title: "معالج Intel Xeon E5-2630 v4",
                image: "https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?q=80&w=500",
                idLabel: "عنوان الاستلام:",
                idPlaceholder: "الاسم ورقم الهاتف",
                packages: [
                    { name: "معالج منفرد (10 كور / 20 ثريد)", price: "25,000 د.ع" }
                ]
            }
        ];

        let selectedItem = null;
        let selectedPkg = null;

        function renderProducts(items) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            items.forEach(item => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${item.image}" class="product-img" alt="${item.title}">
                        <div class="product-title">${item.title}</div>
                        <div class="product-price">${item.packages[0].price} ${item.packages.length > 1 ? 'فما فوق' : ''}</div>
                        <button class="buy-action-btn" onclick="openModal('${item.id}')">شراء الآن 🛒</button>
                    </div>`;
            });
        }

        function openModal(itemId) {
            selectedItem = storeData.find(i => i.id === itemId);
            selectedPkg = null;

            document.getElementById('modalTitle').innerText = selectedItem.title;
            document.getElementById('inputLabel').innerText = selectedItem.idLabel;
            document.getElementById('userIdentifier').placeholder = selectedItem.idPlaceholder;

            const pkgList = document.getElementById('modalPackagesList');
            pkgList.innerHTML = '';
            selectedItem.packages.forEach(pkg => {
                pkgList.innerHTML += `
                    <div class="modal-pkg-item" onclick="selectPkg(this, '${pkg.name}', '${pkg.price}')">
                        <span><strong>${pkg.name}</strong></span>
                        <span class="pkg-p">${pkg.price}</span>
                    </div>`;
            });

            document.getElementById('buyModal').style.display = 'flex';
        }

        function selectPkg(el, name, price) {
            document.querySelectorAll('.modal-pkg-item').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            selectedPkg = { name, price };

            // تحديث رابط الواتساب المباشر للطلب اليدوي مع تفاصيل المنتج
            const ident = document.getElementById('userIdentifier').value || 'بدون';
            const msg = `مرحباً، اريد شراء:\nالمنتج: ${selectedItem.title}\nالباقة: ${name}\nالسعر: ${price}\nالمعرف/العنوان: ${ident}`;
            document.getElementById('waOrderBtn').href = `https://wa.me/9647767814099?text=${encodeURIComponent(msg)}`;
        }

        function closeModal() {
            document.getElementById('buyModal').style.display = 'none';
            document.getElementById('userIdentifier').value = '';
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = storeData.filter(i => i.title.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        function payWithSuperKey() {
            const ident = document.getElementById('userIdentifier').value.trim();
            if (!selectedPkg) { alert('يرجى اختيار الباقة أولاً!'); return; }
            if (!ident) { alert('يرجى إدخال الحقل المطلوب!'); return; }

            alert(`جاري توجيهك لبوابة الدفع الإلكتروني SuperKey لطلب: ${selectedItem.title} (${selectedPkg.name}) بسعر ${selectedPkg.price} ⚡`);
        }

        window.onload = () => renderProducts(storeData);
    </script>
</body>
</html>
