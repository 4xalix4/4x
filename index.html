<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4X IRAQ | المتجر الذكي للألعاب والخدمات</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --main: #2ecc71;
            --bg: #0f1014;
            --card: #1a1c23;
            --card-border: #2ecc7133;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --danger: #e74c3c;
            --blue: #3498db;
            --gold: #f1c40f;
            --discord: #5865F2;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        /* الهيدر */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        header h1 { color: var(--main); margin: 0; font-size: 22pt; font-weight: 800; }
        
        .btn-main {
            background: var(--main);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-main:hover { opacity: 0.9; transform: scale(1.02); }

        /* شبكة الكروت */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto 80px auto;
        }

        /* الكارت الموحد */
        .card {
            background-color: var(--card);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.15);
        }
        .card img { width: 100%; height: 180px; object-fit: cover; background: #111; }
        .card-body { padding: 18px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
        .card-body h3 { margin: 0 0 10px 0; font-size: 15pt; color: white; }
        
        .info-container { margin-bottom: 15px; font-size: 10pt; color: var(--text-dim); display: flex; flex-direction: column; gap: 5px; }
        .price-tag { color: var(--gold); font-weight: bold; font-size: 12pt; }

        .badge {
            position: absolute; top: 12px; right: 12px;
            padding: 4px 12px; border-radius: 6px; font-size: 8.5pt; font-weight: bold; color: black;
        }
        .badge.free { background: var(--main); }
        .badge.paid { background: var(--gold); }

        .action-btn {
            display: block; width: 100%; padding: 12px 0; border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; box-sizing: border-box;
            transition: 0.2s;
        }
        .btn-buy { background: var(--gold); color: #000; }
        .btn-buy:hover { background: #d4ac0d; }
        .btn-download { background: transparent; border: 2px solid var(--main); color: var(--main); }
        .btn-download:hover { background: var(--main); color: #000; }

        /* نافذة الشراء المنبثقة الموحدة (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 3000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-card {
            background: var(--card); border: 1px solid var(--main);
            border-radius: 15px; width: 90%; max-width: 420px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; text-align: right;
        }
        .close-btn { position: absolute; top: 15px; left: 20px; font-size: 20pt; color: #fff; cursor: pointer; }
        .modal-card h3 { margin-top: 0; color: var(--main); text-align: center; font-size: 16pt; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 9.5pt; margin-bottom: 6px; color: var(--text-dim); }
        .input-group input {
            width: 100%; padding: 12px; background: #0f1014; border: 1px solid #334155;
            color: #fff; border-radius: 8px; box-sizing: border-box; outline: none; font-size: 10.5pt;
        }
        .input-group input:focus { border-color: var(--main); }

        /* الدعم الفني السفلي */
        .support-widget { position: fixed; bottom: 20px; left: 20px; z-index: 1000; }
        .support-btn { background: var(--main); color: black; border: none; padding: 12px 24px; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .support-box { display: none; width: 310px; background: var(--card); border: 1px solid var(--main); border-radius: 12px; padding: 18px; margin-bottom: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.7); }
        .discord-link-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px 0; background: var(--discord); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-bottom: 12px; }
        .notice-box { background: #0f1014; border-right: 3px solid var(--gold); padding: 10px; border-radius: 6px; font-size: 9pt; color: var(--text); line-height: 1.5; margin-bottom: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 4X IRAQ</h1>
        <button class="btn-main" onclick="checkAdminPassword()">لوحة التحكم</button>
    </header>

    <!-- لوحة التحكم (مخفية) -->
    <section id="adminPanel" style="display:none; background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 30px;">
        <h2 id="panelTitle" style="color: var(--main); margin-top:0;">إضافة منتج جديد</h2>
        <input type="hidden" id="editGameId">
        <div class="input-group"><input type="text" id="gameTitle" placeholder="اسم المنتج"></div>
        <div class="input-group"><input type="text" id="gameSize" placeholder="الحجم (اختياري)"></div>
        <div class="input-group"><input type="text" id="gamePrice" placeholder="السعر"></div>
        <div class="input-group"><input type="text" id="gameImage" placeholder="رابط الصورة"></div>
        <div class="input-group"><input type="text" id="gameLink" placeholder="رابط التحميل أو رابط الشراء"></div>
        <div class="input-group">
            <select id="gameType" style="width:100%; padding:12px; background:#0f1014; border:1px solid #334155; color:#fff; border-radius:8px;">
                <option value="free">مجانية (تحميل مباشر)</option>
                <option value="paid">مدفوعة (فتح نافذة الشراء)</option>
            </select>
        </div>
        <button class="btn-main" id="submitGameBtn" onclick="addGame()">حفظ المنتج 🚀</button>
    </section>

    <h2 style="text-align: center; margin-bottom: 25px; color: white;">الألعاب والخدمات المتوفرة</h2>
    <div class="grid" id="gamesGrid"><p style="text-align: center;">جاري جلب البيانات...</p></div>

    <!-- نافذة الشراء الموحدة الأوتوماتيكية -->
    <div class="modal-overlay" id="buyModal">
        <div class="modal-card">
            <span class="close-btn" onclick="closeBuyModal()">&times;</span>
            <h3 id="modalGameTitle">💳 تفاصيل الشراء</h3>
            <p style="font-size: 9.5pt; color: var(--text-dim); text-align: center; margin-bottom: 20px;">
                ادخل رقم الـ ID الخاص بك ليصلك الشحن فوراً بعد اكتمال العملية
            </p>

            <div class="input-group">
                <label>رقم المعرف (Player ID):</label>
                <input type="number" id="playerID" placeholder="مثال: 5123456789">
            </div>

            <button class="action-btn btn-buy" style="font-size: 11pt;" onclick="proceedToPayment()">
                متابعة الدفع بـ SuperKey ⚡
            </button>
            <p id="paymentStatus" style="font-size: 9pt; color: var(--gold); text-align: center; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- الدعم الفني -->
    <div class="support-widget">
        <div class="support-box" id="supportBox">
            <h4 style="margin:0 0 10px 0; color:var(--main); text-align:center;">🛠️ الدعم الفني</h4>
            <a href="https://discord.gg/Swmu4QVUqG" target="_blank" class="discord-link-btn">الانضمام لسيرفر الديسكورد 💬</a>
            <div class="notice-box">⚠️ <b>تنبيه مهم:</b> إذا تم إرسال الطلب أو الشحن وتسليمه لك بنجاح، فلا يمكن استرجاع المبلغ نهائياً.</div>
            <div class="input-group"><input type="text" id="supportText" placeholder="اكتب مشكلتك هنا..."></div>
            <button class="btn-main" style="width: 100%;" onclick="sendSuggestion()">إرسال 📩</button>
        </div>
        <button class="support-btn" onclick="toggleSupportBox()">🛠️ الدعم الفني</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDlR7HCZj3nDngFkDEdeoIXHGsAK6hCPFY",
            authDomain: "x-iraq.firebaseapp.com",
            databaseURL: "https://x-iraq-default-rtdb.firebaseio.com",
            projectId: "x-iraq",
            storageBucket: "x-iraq.firebaseimagesstorage.app",
            messagingSenderId: "711532790010",
            appId: "1:711532790010:web:0989b70be91259efaac943"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let currentSelectedGame = null;

        function fetchGames() {
            database.ref('games').on('value', (snapshot) => {
                const grid = document.getElementById('gamesGrid');
                const data = snapshot.val();
                grid.innerHTML = '';
                if(data) {
                    Object.keys(data).reverse().forEach(key => {
                        const game = data[key];
                        const defaultImg = "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=500";
                        const gameImg = (game.image && game.image.trim() !== "") ? game.image : defaultImg;

                        let badge = game.type === 'paid' ? '<span class="badge paid">مدفوعة</span>' : '<span class="badge free">مجانية</span>';
                        let actionButton = game.type === 'paid' 
                            ? `<button class="action-btn btn-buy" onclick="openBuyModal('${game.title}')">شراء الخدمة 🛒</button>`
                            : `<a href="${game.link}" target="_blank" class="action-btn btn-download">تحميل اللعبة 📥</a>`;

                        grid.innerHTML += `
                            <div class="card">
                                ${badge}
                                <img src="${gameImg}">
                                <div class="card-body">
                                    <h3>${game.title}</h3>
                                    <div class="info-container">
                                        ${game.size ? `<span>الحجم: ${game.size}</span>` : ''}
                                        ${game.price ? `<span class="price-tag">السعر: ${game.price}</span>` : ''}
                                    </div>
                                    ${actionButton}
                                </div>
                            </div>`;
                    });
                } else {
                    grid.innerHTML = '<p style="text-align:center;">لا توجد منتجات حالياً.</p>';
                }
            });
        }

        function openBuyModal(title) {
            currentSelectedGame = title;
            document.getElementById('modalGameTitle').innerText = "شراء: " + title;
            document.getElementById('buyModal').style.display = 'flex';
        }

        function closeBuyModal() {
            document.getElementById('buyModal').style.display = 'none';
            document.getElementById('playerID').value = '';
            document.getElementById('paymentStatus').innerText = '';
        }

        function proceedToPayment() {
            const playerID = document.getElementById('playerID').value;
            if(!playerID || playerID.length < 6) {
                alert("يرجى كتابة رقم ID صحيح للعبة!");
                return;
            }
            document.getElementById('paymentStatus').innerText = "جاري تحويلك إلى SuperKey لتأكيد الدفع... ⏳";
            
            /* الخطوة القادمة: هنا سيتم وضع كود الاتصال بـ API سوبر كي بعد حصولك على الـ Keys */
        }

        function toggleSupportBox() {
            const box = document.getElementById('supportBox');
            box.style.display = (box.style.display === 'block') ? 'none' : 'block';
        }

        function sendSuggestion() {
            const text = document.getElementById('supportText').value;
            if(text) {
                database.ref('suggestions').push().set({ message: text, timestamp: new Date().toISOString() });
                alert("تم الإرسال بنجاح!");
                document.getElementById('supportText').value = '';
            }
        }

        window.onload = fetchGames;
    </script>
</body>
</html>
