<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4X IRAQ | المتجر الذكي للألعاب والخدمات</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --main: #2ecc71;
            --bg: #0f1014;
            --card: #1a1c23;
            --card-border: #2ecc7133;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --gold: #f1c40f;
            --discord: #5865F2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        /* الهيدر */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            margin-bottom: 30px;
        }
        header h1 { color: var(--main); font-size: 22pt; font-weight: 800; }
        
        .btn-main {
            background: var(--main); color: #000; border: none; padding: 10px 20px;
            border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .btn-main:hover { opacity: 0.9; transform: scale(1.02); }

        /* شبكة الكروت */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto 80px auto;
        }

        /* الكارت الموحد */
        .card {
            background-color: var(--card);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.15);
        }
        .card img { width: 100%; height: 180px; object-fit: cover; background: #111; }
        .card-body { padding: 18px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
        .card-body h3 { margin: 0 0 10px 0; font-size: 15pt; color: white; }

        .badge {
            position: absolute; top: 12px; right: 12px;
            padding: 4px 12px; border-radius: 6px; font-size: 8.5pt; font-weight: bold; color: black; background: var(--gold);
        }

        .action-btn {
            display: block; width: 100%; padding: 12px 0; border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; background: var(--gold); color: #000;
            transition: 0.2s; margin-top: auto;
        }
        .action-btn:hover { background: #d4ac0d; }

        /* نافذة الشراء والباقات المنبثقة (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 3000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-card {
            background: var(--card); border: 1px solid var(--main);
            border-radius: 15px; width: 90%; max-width: 440px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; text-align: right;
        }
        .close-btn { position: absolute; top: 15px; left: 20px; font-size: 20pt; color: #fff; cursor: pointer; }
        .modal-card h3 { margin-top: 0; color: var(--main); text-align: center; font-size: 16pt; }

        /* قائمة الباقات داخل النسبة المنبثقة */
        .packages-list {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .package-item {
            background: #0f1014;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid #334155;
            transition: 0.2s;
        }
        .package-item:hover, .package-item.selected {
            border-color: var(--main);
            background: #16221a;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 9.5pt; margin-bottom: 6px; color: var(--text-dim); }
        .input-group input {
            width: 100%; padding: 12px; background: #0f1014; border: 1px solid #334155;
            color: #fff; border-radius: 8px; box-sizing: border-box; outline: none; font-size: 10.5pt;
        }
        .input-group input:focus { border-color: var(--main); }

        /* الدعم الفني */
        .support-widget { position: fixed; bottom: 20px; left: 20px; z-index: 1000; }
        .support-btn { background: var(--main); color: black; border: none; padding: 12px 24px; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .support-box { display: none; width: 310px; background: var(--card); border: 1px solid var(--main); border-radius: 12px; padding: 18px; margin-bottom: 12px; }
        .discord-link-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px 0; background: var(--discord); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-bottom: 12px; }
        .notice-box { background: #0f1014; border-right: 3px solid var(--gold); padding: 10px; border-radius: 6px; font-size: 9pt; color: var(--text); line-height: 1.5; margin-bottom: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 4X IRAQ</h1>
        <button class="btn-main" onclick="alert('لوحة التحكم قيد التحديث للنظام الجديد')">لوحة التحكم</button>
    </header>

    <h2 style="text-align: center; margin-bottom: 25px; color: white;">اختر اللعبة أو الخدمة</h2>
    <div class="grid" id="gamesGrid"></div>

    <!-- النافذة المنبثقة الاوتوماتيكية للباقات والدفع -->
    <div class="modal-overlay" id="buyModal">
        <div class="modal-card">
            <span class="close-btn" onclick="closeBuyModal()">&times;</span>
            <h3 id="modalGameTitle">💳 تفاصيل الشراء</h3>
            
            <p style="font-size: 9.5pt; color: var(--text-dim); text-align: center; margin: 10px 0 15px 0;">
                اختر الباقة المناسبة ثم ادخل بيانات الحساب
            </p>

            <div class="packages-list" id="packagesList"></div>

            <div class="input-group">
                <label id="inputLabel">رقم المعرف (Player ID):</label>
                <input type="text" id="playerID" placeholder="أدخل بيانات المعرف هنا...">
            </div>

            <button class="action-btn" style="font-size: 11pt;" onclick="proceedToPayment()">
                متابعة الدفع بـ SuperKey ⚡
            </button>
            <p id="paymentStatus" style="font-size: 9pt; color: var(--gold); text-align: center; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- الدعم الفني -->
    <div class="support-widget">
        <div class="support-box" id="supportBox">
            <h4 style="margin:0 0 10px 0; color:var(--main); text-align:center;">🛠️ الدعم الفني</h4>
            <a href="https://discord.gg/Swmu4QVUqG" target="_blank" class="discord-link-btn">الانضمام لسيرفر الديسكورد 💬</a>
            <div class="notice-box">⚠️ <b>تنبيه مهم:</b> إذا تم إرسال الطلب أو الشحن وتسليمه لك بنجاح، فلا يمكن استرجاع المبلغ نهائياً.</div>
            <div class="input-group"><input type="text" id="supportText" placeholder="اكتب مشكلتك هنا..."></div>
            <button class="btn-main" style="width: 100%;" onclick="sendSuggestion()">إرسال 📩</button>
        </div>
        <button class="support-btn" onclick="toggleSupportBox()">🛠️ الدعم الفني</button>
    </div>

    <script>
        // 1. قاعدة بيانات الألعاب والباقات (تقدر تضيف أو تعدل أي لعبة من هنا بكل سهولة)
        const gamesData = [
            {
                id: "pubg",
                title: "PUBG Mobile",
                image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=500",
                idLabel: "رقم الـ Player ID:",
                idPlaceholder: "مثال: 5123456789",
                packages: [
                    { name: "60 UC", price: "1,500 د.ع" },
                    { name: "325 UC", price: "7,500 د.ع" },
                    { name: "660 UC", price: "15,000 د.ع" }
                ]
            },
            {
                id: "roblox",
                title: "Roblox",
                image: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=500",
                idLabel: "اسم المستخدم (Username):",
                idPlaceholder: "أدخل اسم حسابك في روبلوكس",
                packages: [
                    { name: "400 Robux", price: "10 آسيا" },
                    { name: "800 Robux", price: "20 آسيا" }
                ]
            },
            {
                id: "discord",
                title: "Discord Nitro",
                image: "https://images.unsplash.com/photo-1614680376593-902f749f7041?q=80&w=500",
                idLabel: "يوزر الديسكورد (Discord Tag):",
                idPlaceholder: "مثال: ali_4x",
                packages: [
                    { name: "Nitro Basic (شهر)", price: "5,000 د.ع" },
                    { name: "Nitro Boost (شهر)", price: "12,000 د.ع" }
                ]
            },
            {
                id: "minecraft",
                title: "Minecraft Coins",
                image: "https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=500",
                idLabel: "اسم حساب ماين كرافت (Xbox Gamertag):",
                idPlaceholder: "أدخل Gamertag الخاص بك",
                packages: [
                    { name: "1020 Coins", price: "10$" },
                    { name: "1720 Coins", price: "15$" }
                ]
            }
        ];

        let selectedGame = null;
        let selectedPackage = null;

        // 2. دالة بناء كروت الألعاب أوتوماتيكياً
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            gamesData.forEach(game => {
                grid.innerHTML += `
                    <div class="card">
                        <span class="badge">مدفوعة</span>
                        <img src="${game.image}" alt="${game.title}">
                        <div class="card-body">
                            <h3>${game.title}</h3>
                            <button class="action-btn" onclick="openBuyModal('${game.id}')">شراء الخدمة 🛒</button>
                        </div>
                    </div>`;
            });
        }

        // 3. فتح النافذة وعرض باقات اللعبة المحددة
        function openBuyModal(gameId) {
            selectedGame = gamesData.find(g => g.id === gameId);
            selectedPackage = null;

            document.getElementById('modalGameTitle').innerText = "شراء: " + selectedGame.title;
            document.getElementById('inputLabel').innerText = selectedGame.idLabel;
            document.getElementById('playerID').placeholder = selectedGame.idPlaceholder;
            
            const pkgList = document.getElementById('packagesList');
            pkgList.innerHTML = '';

            selectedGame.packages.forEach((pkg, index) => {
                pkgList.innerHTML += `
                    <div class="package-item" onclick="selectPackage(this, '${pkg.name}', '${pkg.price}')">
                        <span><strong>${pkg.name}</strong></span>
                        <span style="color: var(--gold); font-weight: bold;">${pkg.price}</span>
                    </div>`;
            });

            document.getElementById('buyModal').style.display = 'flex';
        }

        function selectPackage(element, name, price) {
            document.querySelectorAll('.package-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedPackage = { name, price };
        }

        function closeBuyModal() {
            document.getElementById('buyModal').style.display = 'none';
            document.getElementById('playerID').value = '';
            document.getElementById('paymentStatus').innerText = '';
        }

        function proceedToPayment() {
            const idVal = document.getElementById('playerID').value.trim();

            if (!selectedPackage) {
                alert("يرجى اختيار الباقة المطلوبة أولاً!");
                return;
            }
            if (!idVal) {
                alert("يرجى إدخال الحقل المطلوب!");
                return;
            }

            document.getElementById('paymentStatus').innerText = `تم اختيار ${selectedPackage.name}.. جاري التحويل لبوابة SuperKey ⚡`;
        }

        function toggleSupportBox() {
            const box = document.getElementById('supportBox');
            box.style.display = (box.style.display === 'block') ? 'none' : 'block';
        }

        window.onload = renderGames;
    </script>
</body>
</html>
