<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4X IRAQ | متجر الألعاب</title>
    <style>
        :root { --main-color: #2ecc71; --bg-dark: #0f1014; --card-bg: #1a1c23; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        header { text-align: center; padding: 20px; border-bottom: 2px solid var(--main-color); margin-bottom: 30px; }
        h1 { color: var(--main-color); margin: 0; font-size: 2.5rem; text-shadow: 0 0 10px rgba(46, 204, 113, 0.3); }
        
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .game-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; transition: 0.3s; border: 1px solid #333; }
        .game-card:hover { transform: translateY(-5px); border-color: var(--main-color); }
        .game-img { width: 100%; height: 200px; object-fit: cover; background: #222; }
        .game-info { padding: 15px; text-align: center; }
        .game-title { font-size: 1.2rem; margin: 10px 0; font-weight: bold; }
        .game-price { color: var(--main-color); font-size: 1.1rem; margin-bottom: 15px; display: block; }
        
        .download-btn { 
            display: inline-block; background: var(--main-color); color: black; 
            padding: 10px 25px; border-radius: 8px; text-decoration: none; 
            font-weight: bold; transition: 0.2s; width: 80%;
        }
        .download-btn:hover { opacity: 0.9; box-shadow: 0 0 15px var(--main-color); }
        
        .footer-note { text-align: center; margin-top: 50px; color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <h1>4X IRAQ</h1>
    <p>أفضل الألعاب والبرامج في العراق</p>
</header>

<div class="games-grid" id="gamesContainer">
    <div class="game-card">
        <img src="https://via.placeholder.com/300x200?text=Minecraft" class="game-img" alt="لعبة">
        <div class="game-info">
            <div class="game-title">Minecraft PC</div>
            <span class="game-price">5,000 IQD</span>
            <a href="رابط_التحميل_هنا" class="download-btn">تحميل الآن</a>
        </div>
    </div>

    <div class="game-card">
        <img src="https://via.placeholder.com/300x200?text=GTA+V" class="game-img" alt="لعبة">
        <div class="game-info">
            <div class="game-title">GTA V Premium</div>
            <span class="game-price">10,000 IQD</span>
            <a href="رابط_التحميل_هنا" class="download-btn">تحميل الآن</a>
        </div>
    </div>

</div>

<div class="footer-note">
    <p>© 2026 4X SHOP IRAQ - جميع الحقوق محفوظة</p>
</div>

</body>
</html>
