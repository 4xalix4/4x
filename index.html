<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4X IRAQ | المتجر الذكي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --main: #2ecc71; --bg: #0f1014; --card: #1a1c23; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; text-align: center; }
        header { padding: 20px; border-bottom: 2px solid var(--main); margin-bottom: 30px; cursor: pointer; }
        h1 { color: var(--main); margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 15px; padding: 15px; border: 1px solid #333; position: relative; transition: 0.3s; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; background: #222; }
        .price-tag { display: inline-block; padding: 5px 15px; border-radius: 20px; margin: 10px 0; font-weight: bold; border: 1px solid var(--main); color: var(--main); }
        .free-tag { border-color: #3498db; color: #3498db; }
        .btn { background: var(--main); color: black; padding: 12px; border-radius: 8px; text-decoration: none; display: block; font-weight: bold; }
        
        /* لوحة التحكم */
        .admin-panel { display: none; background: #222; padding: 20px; border-radius: 15px; margin: 0 auto 30px auto; border: 2px dashed var(--main); max-width: 400px; }
        input, select { width: 90%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: white; }
        
        /* أزرار الإدارة (تكون مخفية) */
        .admin-controls { display: none; margin-top: 15px; padding-top: 10px; border-top: 1px solid #333; }
        .del-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-left: 5px; }
        .edit-btn { background: #f1c40f; color: black; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<header onclick="toggleAdmin()">
    <h1>4X IRAQ</h1>
    <p>المتجر الرسمي</p>
</header>

<div id="adminArea" class="admin-panel">
    <div id="loginSection">
        <input type="password" id="adminPass" placeholder="أدخل رمز الإدارة">
        <button onclick="checkPass()" style="background:var(--main); border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-weight:bold;">دخول</button>
    </div>

    <div id="uploadSection" style="display:none;">
        <h3 id="formTitle">إضافة لعبة جديدة</h3>
        <input type="hidden" id="editKey">
        <input type="text" id="gTitle" placeholder="اسم اللعبة">
        <select id="gType" onchange="updatePriceInput()">
            <option value="free">مجانية تماماً</option>
            <option value="paid">مدفوعة (بسعر)</option>
        </select>
        <input type="text" id="gPrice" placeholder="أدخل السعر (مثلاً: 5,000 IQD)" style="display:none;">
        <input type="text" id="gImg" placeholder="رابط صورة اللعبة">
        <input type="text" id="gLink" placeholder="رابط التحميل">
        <button id="submitBtn" onclick="addGame()" style="background:var(--main); width:100%; padding:12px; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">نشر الآن</button>
        <button onclick="cancelEdit()" id="cancelBtn" style="display:none; background:#555; width:100%; margin-top:5px; padding:10px; border:none; border-radius:8px; color:white;">إلغاء التعديل</button>
    </div>
</div>

<div class="grid" id="container">جاري تحميل الألعاب...</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDir7HCzj3n6ngfkDedeoIXHGsAK6hCPFY",
        authDomain: "x-iraq.firebaseapp.com",
        databaseURL: "https://x-iraq-default-rtdb.firebaseio.com/",
        projectId: "x-iraq",
        storageBucket: "x-iraq.appspot.com",
        messagingSenderId: "711532790810",
        appId: "1:711532790810:web:0989b70be91259efaac943"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let isAdmin = false;

    function toggleAdmin() {
        let area = document.getElementById('adminArea');
        area.style.display = (area.style.display === 'block') ? 'none' : 'block';
    }

    function checkPass() {
        if(document.getElementById('adminPass').value === "4444") {
            isAdmin = true;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('uploadSection').style.display = 'block';
            showAdminButtons(); // إظهار أزرار الحذف والتعديل في البطاقات
        } else { alert("الرمز خطأ!"); }
    }

    function updatePriceInput() {
        let type = document.getElementById('gType').value;
        document.getElementById('gPrice').style.display = (type === 'paid') ? 'block' : 'none';
    }

    function addGame() {
        const title = document.getElementById('gTitle').value;
        const type = document.getElementById('gType').value;
        const price = (type === 'free') ? 'مجانية تماماً' : document.getElementById('gPrice').value;
        const img = document.getElementById('gImg').value;
        const link = document.getElementById('gLink').value;
        const key = document.getElementById('editKey').value;

        if(title && price && img && link) {
            if(key) {
                db.ref('games/' + key).update({ title, price, img, link, type });
                alert("تم التعديل بنجاح!");
            } else {
                db.ref('games').push({ title, price, img, link, type });
                alert("تم النشر بنجاح!");
            }
            location.reload();
        } else { alert("اكمل البيانات أولاً"); }
    }

    db.ref('games').on('value', (snap) => {
        const container = document.getElementById('container');
        container.innerHTML = '';
        snap.forEach((child) => {
            const data = child.val();
            let isFree = (data.type === 'free') ? 'free-tag' : '';
            container.innerHTML += `
                <div class="card">
                    <img src="${data.img}" onerror="this.src='https://via.placeholder.com/300x180?text=4X+IRAQ'">
                    <h3>${data.title}</h3>
                    <span class="price-tag ${isFree}">${data.price}</span>
                    <a href="${data.link}" target="_blank" class="btn">تحميل الآن</a>
                    <div class="admin-controls" id="controls-${child.key}">
                        <button class="edit-btn" onclick="startEdit('${child.key}', '${data.title}', '${data.type}', '${data.price}', '${data.img}', '${data.link}')">تعديل</button>
                        <button class="del-btn" onclick="deleteGame('${child.key}')">حذف</button>
                    </div>
                </div>`;
        });
        if(isAdmin) showAdminButtons();
    });

    function showAdminButtons() {
        document.querySelectorAll('.admin-controls').forEach(el => el.style.display = 'block');
    }

    function deleteGame(k) { if(confirm("هل أنت متأكد من الحذف؟")) db.ref('games/'+k).remove(); }

    function startEdit(key, title, type, price, img, link) {
        document.getElementById('editKey').value = key;
        document.getElementById('gTitle').value = title;
        document.getElementById('gType').value = type;
        document.getElementById('gPrice').value = (type === 'paid') ? price : '';
        document.getElementById('gImg').value = img;
        document.getElementById('gLink').value = link;
        updatePriceInput();
        
        document.getElementById('formTitle').innerText = "تعديل اللعبة";
        document.getElementById('submitBtn').innerText = "حفظ التعديلات";
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo(0,0);
    }

    function cancelEdit() { location.reload(); }
</script>
</body>
</html>
