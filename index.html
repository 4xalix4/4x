<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4X IRAQ | متجر الألعاب</title>
    <style>
        :root { --main-color: #2ecc71; --bg-dark: #0f1014; --card-bg: #1a1c23; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; }
        header { text-align: center; padding: 30px; border-bottom: 2px solid var(--main-color); margin-bottom: 30px; }
        h1 { color: var(--main-color); margin: 0; font-size: 2.5rem; text-shadow: 0 0 10px rgba(46, 204, 113, 0.3); }
        .games-grid { display: grid; grid-gap: 20px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); max-width: 1200px; margin: 0 auto; }
        .game-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; transition: 0.3s; border: 1px solid #333; position: relative; }
        .game-card:hover { transform: translateY(-5px); border-color: var(--main-color); }
        .game-img { width: 100%; height: 180px; object-fit: cover; background: #222; }
        .game-info { padding: 15px; text-align: center; }
        .game-title { font-size: 1.2rem; margin: 10px 0; font-weight: bold; }
        
        /* ستايل السعر أو كلمة مجاني */
        .price-tag { display: inline-block; padding: 5px 15px; border-radius: 20px; margin-bottom: 15px; font-weight: bold; }
        .price-paid { background: rgba(46, 204, 113, 0.1); color: var(--main-color); border: 1px solid var(--main-color); }
        .price-free { background: rgba(52, 152, 219, 0.1); color: #3498db; border: 1px solid #3498db; }

        .download-btn { 
            display: block; background: var(--main-color); color: black; 
            padding: 12px; border-radius: 8px; text-decoration: none; 
            font-weight: bold; transition: 0.2s;
        }
        .download-btn:hover { box-shadow: 0 0 15px var(--main-color); opacity: 0.9; }
    </style>
</head>
<body>

<header>
    <h1>4X IRAQ</h1>
    <p>أفضل الألعاب والبرامج في العراق</p>
</header>

<div class="games-grid">

    <div class="game-card">
        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500" class="game-img">
        <div class="game-info">
            <div class="game-title">GTA V Premium</div>
            <div class="price-tag price-paid">10,000 IQD</div>
            <a href="رابط_التحميل" class="download-btn">تحميل الآن</a>
        </div>
    </div>

    <div class="game-card">
        <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500" class="game-img">
        <div class="game-info">
            <div class="game-title">Minecraft PC</div>
            <div class="price-tag price-free">مجانية تماماً</div>
            <a href="رابط_التحميل" class="download-btn">تحميل الآن</a>
        </div>
    </div>

</div>

<p style="text-align: center; color: #555; margin-top: 50px;">© 2026 4X SHOP IRAQ</p>

</body>
</html>
